name: Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-package
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: fasih_report_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1

  # Hostinger shared hosting (tanpa SSH): build di GitHub, kirim satu zip lewat HTTPS ke
  # /_deploy/package (diekstrak di server), lalu panggil /_deploy untuk migrate + refresh cache.
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Package
        run: |
          zip -qr ../package.zip . \
            -x '.git/*' '.github/*' 'node_modules/*' 'tests/*' '.env' '.env.*' '.claude/*' '.mcp.json'
          ls -lh ../package.zip

      # Kirim ke server; coba ulang bila gagal dan tampilkan kode HTTP-nya di ringkasan Actions
      - name: Upload package
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS --max-time 900 -o response.txt -w '%{http_code}' -X POST \
              -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
              -F "package=@../package.zip" \
              "${{ secrets.APP_URL }}/_deploy/package" || echo 000)
            cat response.txt 2>/dev/null | head -c 500; echo
            [ "$code" = "200" ] && exit 0
            echo "::warning::Upload percobaan $attempt gagal (HTTP $code)"
            sleep 30
          done
          echo "::error::Upload paket gagal (HTTP $code): $(head -c 300 response.txt 2>/dev/null | tr '\n' ' ')"
          exit 1

      - name: Migrate & refresh cache
        run: |
          code=$(curl -sS --max-time 300 -o response.txt -w '%{http_code}' -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "${{ secrets.APP_URL }}/_deploy" || echo 000)
          cat response.txt
          [ "$code" = "200" ] || { echo "::error::Migrasi gagal (HTTP $code): $(head -c 300 response.txt | tr '\n' ' ')"; exit 1; }

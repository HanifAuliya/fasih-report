name: Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-package
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: fasih_report_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1

  # Hostinger shared hosting (tanpa SSH): build di GitHub, kirim satu zip lewat HTTPS ke
  # /_deploy/package (diekstrak di server), lalu panggil /_deploy untuk migrate + refresh cache.
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      # CDN Hostinger (proteksi bot) kadang memblokir server GitHub dengan 403. Semua request deploy
      # dikirim langsung ke server asal (IP yang sama dengan FTP_SERVER) lewat --resolve.
      - name: Route to origin server
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ORIGIN_IP: ${{ secrets.FTP_SERVER }}
        run: |
          host=$(printf '%s' "$APP_URL" | sed -E 's#^https?://([^/:]+).*#\1#')
          ip=$(printf '%s' "$ORIGIN_IP" | tr -d '[:space:]'); ip=${ip#*://}; ip=${ip%%/*}; ip=${ip%%:*}
          if [[ "$ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ORIGIN=--resolve $host:443:$ip" >> "$GITHUB_ENV"
            echo "Deploy langsung ke server asal (tanpa CDN)"
          else
            echo "ORIGIN=--globoff" >> "$GITHUB_ENV"
            echo "::warning::FTP_SERVER bukan IP: deploy lewat CDN"
          fi

      # Hanya file yang berubah sejak commit yang terpasang di server (ekstrak ribuan file
      # melewati batas waktu hosting). vendor/ ikut hanya bila composer.lock berubah.
      - name: Package
        run: |
          code=$(curl -sS $ORIGIN --max-time 60 -o base.txt -w '%{http_code}' -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "${{ secrets.APP_URL }}/_deploy/status" || echo 000)
          base=$(tr -d '[:space:]' < base.txt 2>/dev/null)

          # Server tidak menjawab dengan benar: jangan kirim semua file (pasti kena batas waktu)
          if [ "$code" != "200" ]; then
            echo "::error::Tidak bisa membaca versi di server (HTTP $code). Coba jalankan ulang deploy beberapa menit lagi."
            exit 1
          fi

          if [[ "$base" =~ ^[0-9a-f]{7,40}$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Kirim file yang berubah sejak $base"
            git diff --name-only --diff-filter=ACMRT "$base" HEAD -- . ':!tests' ':!.github' ':!.claude' > ../files.txt
            if grep -qx 'composer.lock' ../files.txt; then
              printf 'vendor\nbootstrap/cache\n' >> ../files.txt
            fi
          else
            echo "::warning::Versi di server belum tercatat: kirim semua file"
            ls -A | grep -vxE '\.git|\.github|node_modules|tests|\.claude|\.mcp\.json|\.env.*' > ../files.txt
          fi

          echo 'public/build' >> ../files.txt
          zip -qr ../package.zip -@ < ../files.txt
          echo "$(wc -l < ../files.txt) path, $(unzip -l ../package.zip | tail -1)"

      # Kirim ke server; coba ulang bila gagal dan tampilkan kode HTTP-nya di ringkasan Actions
      - name: Upload package
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS $ORIGIN --max-time 900 -o response.txt -w '%{http_code}' -X POST \
              -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
              -F "package=@../package.zip" \
              -F "sha=${{ github.sha }}" \
              "${{ secrets.APP_URL }}/_deploy/package" || echo 000)
            cat response.txt 2>/dev/null | head -c 500; echo
            [ "$code" = "200" ] && exit 0
            echo "::warning::Upload percobaan $attempt gagal (HTTP $code)"
            sleep 30
          done
          echo "::error::Upload paket gagal (HTTP $code): $(head -c 300 response.txt 2>/dev/null | tr '\n' ' ')"
          exit 1

      - name: Migrate & refresh cache
        run: |
          code=$(curl -sS $ORIGIN --max-time 300 -o response.txt -w '%{http_code}' -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "${{ secrets.APP_URL }}/_deploy" || echo 000)
          cat response.txt
          [ "$code" = "200" ] || { echo "::error::Migrasi gagal (HTTP $code): $(head -c 300 response.txt | tr '\n' ' ')"; exit 1; }

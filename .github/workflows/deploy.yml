name: Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: fasih_report_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1

  # Hostinger shared hosting (tanpa SSH): build di GitHub, upload via FTP,
  # lalu panggil /_deploy untuk migrate + refresh cache.
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      # Rapikan isi secret: buang ftp://, spasi/enter, dan pastikan folder diakhiri "/"
      - name: Prepare FTP settings
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          host=$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')
          host=${host#*://}
          host=${host%%/*}
          host=${host%%:*}
          user=$(printf '%s' "$FTP_USERNAME" | tr -d '[:space:]')
          dir=$(printf '%s' "$FTP_SERVER_DIR" | tr -d '[:space:]')
          dir=${dir#/}
          [ -n "$dir" ] && [ "${dir%/}" = "$dir" ] && dir="$dir/"
          [ -z "$dir" ] && dir="./"

          for name in host user; do
            [ -z "${!name}" ] && { echo "::error::Secret FTP untuk '$name' kosong / belum dibuat"; exit 1; }
          done
          [[ "$host" =~ ^[0-9.]+$ ]] || getent hosts "$host" > /dev/null || { echo "::error::Host FTP tidak bisa ditemukan (panjang ${#host} karakter). Periksa secret FTP_SERVER."; exit 1; }

          echo "::add-mask::$host"
          echo "::add-mask::$user"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "user=$user" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Folder tujuan: $dir"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ steps.ftp.outputs.user }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.dir }}
          # .gitignore di storage/ sengaja ikut diupload supaya folder storage terbentuk di server
          exclude: |
            .git/**
            .github/**
            node_modules/**
            tests/**
            .env
            .env.*
            .claude/**
            .mcp.json

      - name: Migrate & refresh cache
        run: |
          curl --fail-with-body -sS -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "${{ secrets.APP_URL }}/_deploy"
